:root{
  --grass-700:#166534;
  --grass-600:#16a34a;
  --grass-100:#dcfce7;
  --gold-500:#ca8a04;
  --ink-900:#111827;
  --ink-500:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 420px at 8% -12%, rgba(22,163,74,.22) 0%, rgba(22,163,74,0) 64%),
    radial-gradient(760px 360px at 98% 0%, rgba(234,179,8,.24) 0%, rgba(234,179,8,0) 62%),
    radial-gradient(620px 420px at 80% 95%, rgba(20,184,166,.12) 0%, rgba(20,184,166,0) 65%),
    linear-gradient(180deg,#f8fafc 0%,#eef4f1 54%,#edf2f7 100%);
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;
  color:var(--ink-900);
  min-height:100vh;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(22,101,52,.045) 1px,transparent 1px),
    linear-gradient(180deg,rgba(22,101,52,.035) 1px,transparent 1px),
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.8),rgba(255,255,255,0) 38%);
  background-size:72px 72px,72px 72px,100% 100%;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,.45) 55%,rgba(0,0,0,.2));
  z-index:0;
}
#root{position:relative;z-index:1;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:999px;}
.inp:focus{border-color:var(--grass-600)!important;box-shadow:0 0 0 3px rgba(22,163,74,.12);outline:none;}
.score-inp:focus{border-color:var(--grass-600)!important;box-shadow:0 0 0 3px rgba(22,163,74,.14);outline:none;}
.btn-acc{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;}
.btn-acc:hover{filter:brightness(.98);box-shadow:0 6px 16px rgba(22,163,74,.22);}
.btn-acc:active{transform:translateY(1px);}
.pill{transition:all .18s;cursor:pointer;}
summary{list-style:none;}
summary::-webkit-details-marker{display:none;}
summary:hover{filter:brightness(.995);}
.match-card{
  border:1px solid rgba(17,24,39,.08)!important;
  animation:cardIn .32s ease both;
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(260px 120px at 50% -30%,rgba(22,163,74,.12),transparent 72%),
    linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.94))!important;
}
.match-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 0 48%,rgba(22,163,74,.08) 48% 52%,transparent 52%),
    radial-gradient(circle at 50% 50%,transparent 0 46px,rgba(22,163,74,.08) 47px 48px,transparent 49px);
  opacity:.5;
  z-index:0;
}
.match-card>*{position:relative;z-index:1;}
.match-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(17,24,39,.12)!important;}
select{cursor:pointer;}
.login-grid{grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);}
.login-hero{min-height:480px;}
.login-hero,.home-hero,.join-hero{
  isolation:isolate;
}
.login-hero:after,.home-hero:after,.join-hero:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(115deg,rgba(255,255,255,.12),rgba(255,255,255,0) 38%),
    radial-gradient(circle at 74% 22%,rgba(255,255,255,.16),rgba(255,255,255,0) 28%),
    linear-gradient(90deg,transparent 0 49.4%,rgba(255,255,255,.10) 49.4% 50.6%,transparent 50.6%);
  opacity:.8;
  z-index:0;
}
.login-hero>*,.home-hero>*,.join-hero>*{position:relative;z-index:1;}
.login-score-grid,.info-grid{grid-template-columns:repeat(3,1fr);}
.join-grid{grid-template-columns:minmax(0,.9fr) minmax(300px,1fr);}
.lux-card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  box-shadow:0 12px 34px rgba(17,24,39,.08),0 1px 2px rgba(17,24,39,.04)!important;
}
.lux-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(240px 120px at 14% -20%,rgba(22,163,74,.12),transparent 70%),

}
.lux-card>*{position:relative;z-index:1;}
.topbar-premium{
  background:rgba(255,255,255,.76)!important;
  border-bottom:1px solid rgba(22,101,52,.12)!important;
  box-shadow:0 10px 28px rgba(15,23,42,.06)!important;
}
.topbar-premium:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:linear-gradient(90deg,transparent,#16a34a,#eab308,transparent);
  opacity:.75;
}
.bottom-nav-premium{display:none!important;}
.bottom-nav-premium button{
  transition:transform .18s ease,color .18s ease,background .18s ease;
}
.bottom-nav-premium button:hover{
  background:rgba(22,163,74,.045)!important;
  transform:translateY(-1px);
}
.btn-acc,.pill,summary,button{
  -webkit-tap-highlight-color:transparent;
}
.mini-tile{
  position:relative;
  overflow:hidden;
}
.mini-tile:after{
  content:"";
  position:absolute;
  inset:auto -18px -24px auto;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}
.brand-chip{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(0,0,0,.10);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
@media (max-width:820px){
  .login-grid,.join-grid{grid-template-columns:1fr!important;}

@media (max-width:620px){

}
@media (max-width:480px){

function calcPts(pred,result){
  if(!result||result.home===''||result.away==='') return null;
  const ph=+pred.home,pa=+pred.away,rh=+result.home,ra=+result.away;
  if(isNaN(ph)||isNaN(pa)) return null;
  const predOutcome=ph>pa?'H':ph<pa?'A':'D';
  const realOutcome=rh>ra?'H':rh<ra?'A':'D';
  const oneScore=ph===rh||pa===ra;
  if(ph===rh&&pa===ra) return 7;
  if(predOutcome===realOutcome&&oneScore) return 4;
  if(predOutcome===realOutcome) return 3;
  if(oneScore) return 1;
  return 0;
}
const fDate=dt=>new Date(dt).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
const fTime=dt=>new Date(dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const dayKeySP=dt=>new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(dt));
const started=dt=>new Date(dt).getTime()<=Date.now();
const isToday=dt=>dayKeySP(dt)===dayKeySP(new Date());
const isUpcoming=dt=>{const h=(new Date(dt).getTime()-Date.now())/3600000;return h>0&&h<=24;};
const timeUntilShort=dt=>{
  const mins=Math.max(0,Math.round((new Date(dt).getTime()-Date.now())/60000));
  if(mins<60) return `${mins}min`;
  const hours=Math.round(mins/60);
  if(hours<48) return `${hours}h`;
  return `${Math.round(hours/24)}d`;
};
const normalizeName=value=>value.trim().replace(/\s+/g,' ');
const isValidName=name=>name.length>=2&&name.length<=24&&!/[.#$\[\]/]/.test(name);
const parseScore=value=>{
  const n=Number(value);
  if(!Number.isInteger(n)||n<0||n>20) return null;
  return n;
};
const parseCsvLine=(line,delimiter=',')=>{
  const out=[];
  let cur='';
  let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(inQuotes&&line[i+1]==='"'){cur+='"';i++;}
      else inQuotes=!inQuotes;
      continue;
    }
    if(ch===delimiter&&!inQuotes){out.push(cur.trim());cur='';continue;}
    cur+=ch;
  }
  out.push(cur.trim());
  return out;
};

function Bolao(){
  const [me,setMe]=useState(''); // auth uid

  const [champWinner,setChampWinner]=useState('');
  const [podiumPreds,setPodiumPreds]=useState({});
  const [bracketPreds,setBracketPreds]=useState({});
  const [officialPodium,setOfficialPodium]=useState(emptyPodium());
  const [officialBracket,setOfficialBracket]=useState(emptyBracket());
  const [pi,setPi]=useState({});        // local prediction inputs
  const [ri,setRi]=useState({});        // local result inputs (admin)
  const [champInput,setChampInput]=useState('');
  const [podiumInput,setPodiumInput]=useState(emptyPodium());
  const [bracketInput,setBracketInput]=useState(emptyBracket());
  const [adminChampInput,setAdminChampInput]=useState('');
  const [officialPodiumInput,setOfficialPodiumInput]=useState(emptyPodium());
  const [officialBracketInput,setOfficialBracketInput]=useState(emptyBracket());
  const [onlyMissing,setOnlyMissing]=useState(false);
  const [matchView,setMatchView]=useState('groups');
  const [reminderEnabled,setReminderEnabled]=useState(localStorage.getItem(REMINDER_STORAGE_KEY)==='1');
  const [lastReminderMatch,setLastReminderMatch]=useState('');
  const [csvImporting,setCsvImporting]=useState(false);
  const [saving,setSaving]=useState(null);
  const [toast,setToast]=useState({msg:'',ok:true});
  const [boot,setBoot]=useState(true);
  const [newM,setNewM]=useState({home:'',away:'',ph:'Grupos',gr:'A',dt:'',venue:''});
  const isAdmin = !!(me && adminIds[me]);
  const firstMatch = matches[0] || BASE_MATCHES[0] || null;
  const champLockDt = firstMatch?.dt || '';
  const champLocked = champLockDt ? started(champLockDt) : false;
  const champLockLabel = champLockDt ? `${fDate(champLockDt)} às ${fTime(champLockDt)}` : 'início do primeiro jogo';
  const matchLocked=m=>m?.ph==='Grupos'?champLocked:started(m?.dt);
  const normalizeBracket=obj=>BRACKET_PHASES.reduce((acc,phase)=>{
    const arr=Array.isArray(obj?.[phase.key])?obj[phase.key]:[];
    acc[phase.key]=Array.from({length:phase.count},(_,i)=>arr[i]||'');
    return acc;
  },{});
  const normalizePodium=obj=>({...emptyPodium(),...(obj||{})});

  const showToast=(msg,ok=true)=>{setToast({msg,ok});setTimeout(()=>setToast({msg:'',ok:true}),2600);};
  const getName = uid => partMeta[uid]?.name || 'Sem nome';
  const meReady = !!me && !!partMeta[me]?.name;

  // ── Auth listener ───────────────────────────────────────────────────────────
  useEffect(()=>{
    const savedName = localStorage.getItem(NAME_STORAGE_KEY) || '';
    const authUnsub = auth.onAuthStateChanged(user=>{
      if(user){
        const fallbackName = normalizeName(savedName || user.displayName || (user.email?user.email.split('@')[0]:''));
        setMe(user.uid);
        setMeEmail(user.email || '');
        setNameInput(fallbackName.slice(0,24));
        setBoot(true);
      }else{
        setMe('');
        setMeName('');
        setMeEmail('');
        setMatches([]);
        setPreds({});
        setParts([]);
        setPartMeta({});
        setAdminIds({});
        setChampPreds({});
        setChampWinner('');
        setPodiumPreds({});
        setBracketPreds({});
        setOfficialPodium(emptyPodium());
        setOfficialBracket(emptyBracket());
        setAudit([]);
        setBoot(false);
      }
      setAuthReady(true);
    });
    return ()=>{authUnsub && authUnsub();};
  },[]);

  // ── Database listeners (only after auth) ───────────────────────────────────
  useEffect(()=>{
    if(!authReady||!me) return;
    let live=true;
    setBoot(true);

    const onReadError=(err,path)=>{
      if(!live) return;
      console.error('Firebase read error:', path, err && (err.code||err.message||err));
      showToast('Erro de leitura no Firebase. Verifique login e regras.',false);
      setBoot(false);
    };

    ref('matches').once('value').then(snap=>{
      if(!snap.val()&&isAdmin){
        const obj={};
        BASE_MATCHES.forEach(m=>{obj[m.id]=m;});
        ref('matches').set(obj).catch(()=>{});
      }
    }).catch(err=>onReadError(err,'matches.once'));

    const matchesRef = ref('matches');
    const predsRef = ref('predictions');
    const partsRef = ref('participants');
    const adminsRef = ref('admins');
    const champRef = ref('champPreds');
    const champWinnerRef = ref('champWinner');
    const podiumRef = ref('podiumPreds');
    const bracketRef = ref('bracketPreds');
    const officialPodiumRef = ref('officialPodium');
    const officialBracketRef = ref('officialBracket');
    const auditQuery = ref('audit').limitToLast(30);

    const matchesUnsub = matchesRef.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||{};
      const arr=Object.values(val).sort((a,b)=>new Date(a.dt)-new Date(b.dt));
      setMatches(arr);
      const riInit={};
      arr.forEach(m=>{riInit[m.id]=m.result||{home:'',away:''};});
      setRi(riInit);
      setBoot(false);
    }, err=>onReadError(err,'matches.on'));

    const predsUnsub = predsRef.on('value', snap=>{
      if(!live) return;
      setPreds(snap.val()||{});
    }, err=>onReadError(err,'predictions.on'));

    const partsUnsub = partsRef.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||{};
      const ids=[];
      const meta={};
      Object.entries(val).forEach(([uid,item])=>{
        if(!item||typeof item!=='object') return;
        const parsedName=normalizeName((item.name||'').toString()).slice(0,24);
        if(!isValidName(parsedName)) return;
        ids.push(uid);
        meta[uid]={name:parsedName,email:item.email||''};
      });
      setParts(ids);
      setPartMeta(meta);
    }, err=>onReadError(err,'participants.on'));

    const adminsUnsub = adminsRef.on('value', snap=>{
      if(!live) return;
      setAdminIds(snap.val()||{});
    }, err=>onReadError(err,'admins.on'));

    const auditUnsub = auditQuery.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||{};
      const arr=Object.entries(val).map(([id,item])=>({id,...item})).sort((a,b)=>(b.ts||0)-(a.ts||0));
      setAudit(arr);
    }, err=>onReadError(err,'audit.on'));

    const champUnsub = champRef.on('value', snap=>{
      if(!live) return;
      setChampPreds(snap.val()||{});
    }, err=>onReadError(err,'champPreds.on'));

    const champWinUnsub = champWinnerRef.on('value', snap=>{
      if(!live) return;
      setChampWinner(snap.val()||'');
    }, err=>onReadError(err,'champWinner.on'));

    const podiumUnsub = podiumRef.on('value', snap=>{
      if(!live) return;
      setPodiumPreds(snap.val()||{});
    }, err=>onReadError(err,'podiumPreds.on'));

    const bracketUnsub = bracketRef.on('value', snap=>{
      if(!live) return;
      setBracketPreds(snap.val()||{});
    }, err=>onReadError(err,'bracketPreds.on'));

    const officialPodiumUnsub = officialPodiumRef.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||emptyPodium();
      setOfficialPodium({...emptyPodium(),...val});
      setOfficialPodiumInput({...emptyPodium(),...val});
      if(val.champ) setAdminChampInput(val.champ);
    }, err=>onReadError(err,'officialPodium.on'));

    const officialBracketUnsub = officialBracketRef.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||emptyBracket();
      const normalized=normalizeBracket(val);
      setOfficialBracket(normalized);
      setOfficialBracketInput(normalized);
    }, err=>onReadError(err,'officialBracket.on'));

    return ()=>{
      live=false;
      matchesRef.off('value', matchesUnsub);
      predsRef.off('value', predsUnsub);
      partsRef.off('value', partsUnsub);
      adminsRef.off('value', adminsUnsub);
      auditQuery.off('value', auditUnsub);
      champRef.off('value', champUnsub);
      champWinnerRef.off('value', champWinUnsub);
      podiumRef.off('value', podiumUnsub);
      bracketRef.off('value', bracketUnsub);
      officialPodiumRef.off('value', officialPodiumUnsub);
      officialBracketRef.off('value', officialBracketUnsub);
    };
  },[authReady, me, isAdmin]);

  // Populate local inputs when user or preds/matches change
  useEffect(()=>{
    if(!me||matches.length===0) return;
    const piInit={};
    matches.forEach(m=>{piInit[m.id]=(preds[me]||{})[m.id]||{home:'',away:''};});
    setPi(piInit);
    setChampInput(champPreds[me]||'');
    setPodiumInput(normalizePodium(podiumPreds[me]||{champ:champPreds[me]||'',vice:'',third:''}));
    setBracketInput(normalizeBracket(bracketPreds[me]||{}));
  },[me, matches, preds[me], champPreds[me], podiumPreds[me], bracketPreds[me]]);

  useEffect(()=>{
    if(me) setChampInput(champPreds[me]||'');
  },[champPreds, me]);

  useEffect(()=>{
    if(me&&partMeta[me]?.name){
      setMeName(partMeta[me].name);
      if(!nameInput) setNameInput(partMeta[me].name);
    }
  },[me, partMeta]);

  useEffect(()=>{
    localStorage.setItem(REMINDER_STORAGE_KEY, reminderEnabled?'1':'0');
  },[reminderEnabled]);

  // ── Actions ─────────────────────────────────────────────────────────────────
  const join=async()=>{
    if(!me){showToast('Faça login com Google primeiro.',false);return;}
    const raw=normalizeName(nameInput);
    if(!isValidName(raw)){
      showToast('Nome inválido (2-24 chars, sem . # $ [ ] /)',false);
      return;
    }
    try{
      localStorage.setItem(NAME_STORAGE_KEY, raw);
      await ref('participants/'+me).update({
        name:raw,
        email:meEmail||'',
        updatedAt:firebase.database.ServerValue.TIMESTAMP,
      });
      const legacyId = parts.find(id=>id!==me&&getName(id).localeCompare(raw,'pt-BR',{sensitivity:'base'})===0);
      if(legacyId){
        if(!preds[me]&&preds[legacyId]) await ref('predictions/'+me).set(preds[legacyId]);
        if(!champPreds[me]&&champPreds[legacyId]) await ref('champPreds/'+me).set(champPreds[legacyId]);
        if(!podiumPreds[me]&&podiumPreds[legacyId]) await ref('podiumPreds/'+me).set(podiumPreds[legacyId]);
        if(!bracketPreds[me]&&bracketPreds[legacyId]) await ref('bracketPreds/'+me).set(bracketPreds[legacyId]);
      }
      setMeName(raw);
      setPartMeta(prev=>({...prev,[me]:{name:raw,email:meEmail||''}}));
      setParts(prev=>prev.includes(me)?prev:[...prev,me]);
      showToast('Perfil salvo!');
    }catch{
      showToast('Erro ao salvar perfil.',false);
    }
    const piInit={};
    matches.forEach(m=>{piInit[m.id]=(preds[me]||{})[m.id]||{home:'',away:''};});
    setPi(piInit);
    setChampInput(champPreds[me]||'');
    setPodiumInput(normalizePodium(podiumPreds[me]||{champ:champPreds[me]||'',vice:'',third:''}));
    setBracketInput(normalizeBracket(bracketPreds[me]||{}));
  };

  const signInGoogle=async()=>{
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      await auth.signInWithPopup(provider);
    }catch{
      showToast('Falha no login Google. Verifique se o provedor está habilitado no Firebase Auth.',false);
    }
  };

  const claimFirstAdmin=async()=>{
    if(!me){showToast('Faça login primeiro.',false);return;}

      await auth.signOut();

  const savePred=async(id)=>{
    const m=matches.find(x=>x.id===id);
    if(!m||matchLocked(m)){showToast('Palpite bloqueado para este jogo.',false);return;}
    const p=pi[id]||{home:'',away:''};
    const home=parseScore(p.home),away=parseScore(p.away);
    if(home===null||away===null){showToast('Placar inválido (0 a 20).',false);return;}
    setSaving(id);

          <div className="lux-card" style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:22,padding:'18px',boxShadow:shadow}}>

            <div style={{fontSize:13,fontWeight:900,color:T.txt1,marginBottom:12}}>O que você acompanha</div>

  // ── Home Tab ────────────────────────────────────────────────────────────────

  const TabMatches=(
    <div style={{padding:'28px 14px 72px',maxWidth:1120,margin:'0 auto'}}>

        <h1 style={{fontSize:30,lineHeight:1.1,color:T.txt1,letterSpacing:-.8,marginBottom:8}}>{matchView==='groups'?'Palpites - Fase de Grupos':'Palpites - Eliminatórias'}</h1>
        <p style={{fontSize:15,color:T.txt2,lineHeight:1.6,maxWidth:760}}>{matchView==='groups'?'Preencha seus palpites para todos os jogos da fase de grupos. A fase inteira trava no início da Copa: ':'Os placares do mata-mata aparecem quando os jogos forem cadastrados e travam no horário de cada partida.'}{matchView==='groups'&&<strong>{champLockLabel}</strong>}</p>
      </div>
      <div className="lux-card" style={{background:T.card,border:'1px solid '+T.border,borderRadius:18,padding:'16px',boxShadow:shadow,marginBottom:18}}>

          <StatTile value={savedGroupPredCount} label="salvos" color={T.accent} bg={T.accentLt}/>
          <StatTile value={Math.max(0,groupMatches.length-savedGroupPredCount)} label="faltando" color={savedGroupPredCount===groupMatches.length?T.accent:T.half} bg={savedGroupPredCount===groupMatches.length?T.accentLt:T.halfBg}/>

          <button className="pill" style={{padding:'10px 14px',borderRadius:999,border:'1px solid '+(onlyMissing?T.half:T.border),fontSize:12,fontWeight:900,background:onlyMissing?T.halfBg:T.card,color:onlyMissing?T.half:T.txt2,cursor:'pointer'}} onClick={()=>setOnlyMissing(true)}>Só faltando</button>

      </div>
      <div style={{display:'flex',alignItems:'center',borderBottom:'1px solid '+T.border,marginBottom:18,gap:18}}>

        <button style={{border:'none',borderBottom:'2px solid '+(matchView==='knockout'?T.accent:'transparent'),background:'transparent',padding:'0 0 12px',fontSize:14,fontWeight:matchView==='knockout'?900:800,color:matchView==='knockout'?T.accent:T.txt3,cursor:'pointer'}} onClick={()=>{setMatchView('knockout');setOnlyMissing(false);}}>Eliminatórias</button>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(420px,1fr))',gap:16}}>

  );

  const TabGeneralPreds=(
    <div style={{padding:'28px 14px 72px',maxWidth:1120,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'flex-end',gap:16,marginBottom:22,flexWrap:'wrap'}}><div style={{flex:1,minWidth:260}}><div style={{fontSize:13,color:T.txt3,marginBottom:8}}>Palpites gerais</div><h1 style={{fontSize:30,lineHeight:1.1,color:T.txt1,letterSpacing:-.8,marginBottom:8}}>Chaveamento, pódio e grupo</h1><p style={{fontSize:15,color:T.txt2,lineHeight:1.6,maxWidth:760}}>Veja participação, salve seu chaveamento e compare palpites quando for justo.</p></div></div>
      <div className="info-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:18}}><StatTile value={bracketFilled+'/'+bracketTotal} label="classificados" color={bracketDone?T.accent:T.half} bg={bracketDone?T.accentLt:T.halfBg}/><StatTile value={podiumFilled+'/3'} label="pódio" color={podiumDone?T.accent:T.half} bg={podiumDone?T.accentLt:T.halfBg}/><StatTile value={champPredCount} label="campeões enviados" color={T.gold} bg={T.goldBg}/><StatTile value={parts.length} label="participantes" color={T.txt1} bg={T.bg}/></div>
      <div id="champion-card" className="lux-card" style={{background:T.card,border:'1px solid '+T.border,borderRadius:18,padding:'18px',boxShadow:shadow,marginBottom:18}}><div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}}><div style={{width:44,height:44,borderRadius:15,background:T.goldBg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>🏆</div><div style={{flex:1}}><div style={{fontSize:16,fontWeight:950,color:T.txt1}}>Chaveamento e Pódio</div><div style={{fontSize:12,color:T.txt2,lineHeight:1.55,marginTop:3}}>Preencha campeão, vice, 3º e classificados de cada fase antes do início da Copa.</div></div></div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:10,marginBottom:14}}>{[['Campeão','champ',CHAMP_PTS],['Vice-campeão','vice',VICE_PTS],['3º lugar','third',THIRD_PTS]].map(item=><div key={item[1]} style={{background:T.bg,border:'1px solid '+T.border,borderRadius:14,padding:'12px'}}><div style={{fontSize:11,fontWeight:950,color:T.txt3,textTransform:'uppercase',letterSpacing:.5,marginBottom:7}}>{item[0]} · {item[2]} pts</div>{!champLocked?<select className="inp" style={{...inpSt,padding:'9px 10px'}} value={podiumInput[item[1]]||''} onChange={e=>{const next={...podiumInput,[item[1]]:e.target.value};setPodiumInput(next);if(item[1]==='champ') setChampInput(e.target.value);}}><option value="">Selecionar...</option>{ALL_TEAMS.map(t=><option key={t} value={t}>{fl(t)} {t}</option>)}</select>:<div style={{fontSize:13,fontWeight:900,color:T.txt1}}>{podiumFor(me)[item[1]]?fl(podiumFor(me)[item[1]])+' '+podiumFor(me)[item[1]]:'-'}</div>}</div>)}</div>{!champLocked&&<button className="btn-acc" style={{...btnAcc,width:'100%',marginBottom:14}} onClick={savePodium} disabled={saving==='podium'}>{saving==='podium'?'Salvando pódio...':'Salvar pódio'}</button>}<details open={!bracketDone&&!champLocked} style={{background:T.bg,border:'1px solid '+T.border,borderRadius:14,overflow:'hidden'}}><summary style={{listStyle:'none',cursor:'pointer',padding:'13px 14px',display:'flex',alignItems:'center',gap:10}}><div style={{flex:1}}><div style={{fontSize:14,fontWeight:950,color:T.txt1}}>Previsão de classificados</div><div style={{fontSize:11,color:T.txt3,marginTop:2}}>{bracketFilled}/{bracketTotal} preenchidos</div></div><span style={{fontSize:16,color:T.txt3}}>⌄</span></summary><div style={{borderTop:'1px solid '+T.border,padding:'12px'}}>{BRACKET_PHASES.map(phase=><details key={phase.key} open={phase.key==='r32'} style={{background:T.card,border:'1px solid '+T.border,borderRadius:12,overflow:'hidden',marginBottom:10}}><summary style={{listStyle:'none',cursor:'pointer',padding:'11px 12px',display:'flex',alignItems:'center',gap:10}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:950,color:T.txt1}}>{phase.label}</div><div style={{fontSize:10,color:T.txt3,marginTop:2}}>{bracketInput[phase.key].filter(Boolean).length}/{phase.count} · {phase.pts} pts por time correto</div></div><span style={{fontSize:15,color:T.txt3}}>⌄</span></summary><div style={{borderTop:'1px solid '+T.border,padding:'10px',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:8}}>{bracketInput[phase.key].map((value,idx)=><select key={idx} disabled={champLocked} className="inp" style={{...inpSt,padding:'8px 9px',fontSize:12}} value={value} onChange={e=>setBracketInput(prev=>{const next=normalizeBracket(prev);next[phase.key]=[...next[phase.key]];next[phase.key][idx]=e.target.value;return next;})}><option value="">{idx+1}. Selecionar</option>{ALL_TEAMS.map(t=><option key={t} value={t}>{fl(t)} {t}</option>)}</select>)}</div></details>)}{!champLocked&&<button className="btn-acc" style={{...btnAcc,width:'100%'}} onClick={saveBracket} disabled={saving==='bracket'}>{saving==='bracket'?'Salvando chaveamento...':'Salvar classificados'}</button>}</div></details></div>
      <SectionTitle title="Jogos por dia" text="Cada jogo abre o detalhe dos participantes quando for permitido."/>{generalDayGroups.map((group,idx)=><details key={group.key} open={idx===0||group.matches.some(m=>isToday(m.dt))} style={{marginBottom:10}}><summary style={{listStyle:'none',cursor:'pointer',background:T.card,border:'1px solid '+T.border,borderRadius:14,padding:'13px 15px',boxShadow:shadow,display:'flex',alignItems:'center',gap:12}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:950,color:T.txt1,textTransform:'capitalize'}}>{group.label}</div><div style={{fontSize:11,color:T.txt3,marginTop:2}}>{group.matches.length} jogo{group.matches.length!==1?'s':''}</div></div><span style={{fontSize:16,color:T.txt3}}>⌄</span></summary><div style={{paddingTop:10}}>{group.matches.map(m=><MatchCard key={m.id} m={m}/>)}</div></details>)}<div style={{height:88}}/>
    </div>
  );
  // ── Shell ───────────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh',background:'transparent',display:'flex',flexDirection:'column'}}>
      {/* Toast */}
      {toast.msg&&<div style={{position:'fixed',top:14,left:'50%',transform:'translateX(-50%)',background:toast.ok?T.ok:T.err,color:'#fff',padding:'9px 22px',borderRadius:24,fontSize:13,fontWeight:600,zIndex:1000,boxShadow:'0 4px 20px rgba(0,0,0,.15)',whiteSpace:'nowrap'}}>{toast.msg}</div>}

      {/* Top bar */}
      <div className="topbar-premium" style={{background:'rgba(255,255,255,.82)',backdropFilter:'blur(10px)',borderBottom:`1px solid ${T.border}`,padding:'12px 14px',position:'sticky',top:0,zIndex:50,boxShadow:'0 1px 4px rgba(0,0,0,.04)'}}>
        <div style={{maxWidth:980,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <span style={{fontSize:18,fontWeight:900,color:'#006B2B',letterSpacing:-.2}}>Nosso Bolão 2026</span>
          </div>
          <nav style={{display:'flex',alignItems:'center',gap:22,fontSize:14}}>
            {[
              ['home','Início'],
              ['matches','Seus Palpites'],
              ['ranking','Ranking'],
              ['rules','Regulamento'],
              ['general','Palpites gerais'],
              ...(isAdmin?[['admin','Admin']]:[]),
            ].map(([k,label])=>(
              <button key={k} onClick={()=>setTab(k)} style={{border:'none',background:'transparent',cursor:'pointer',fontSize:14,color:tab===k?'#009C3B':'#111827',fontWeight:tab===k?800:500}}>{label}</button>
            ))}
          </nav>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:11,color:T.txt3,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{meName}</span>
            <button style={{padding:'6px 12px',borderRadius:20,border:`1px solid ${T.border}`,background:'rgba(255,255,255,.72)',color:T.txt2,fontSize:11,fontWeight:800,cursor:'pointer',boxShadow:'0 6px 16px rgba(15,23,42,.05)'}} onClick={copyLink}>🔗 Convidar</button>
            <button style={{padding:'5px 10px',borderRadius:12,border:`1px solid ${T.border}`,background:'rgba(255,255,255,.62)',color:T.txt3,fontSize:10,cursor:'pointer'}} onClick={logout}>Sair</button>
          </div>
        </div>
      </div>

      <div style={{background:'#00732E',color:'#fff',minHeight:36,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:12}}>🏆 <strong>Bolão ativo</strong><span style={{width:4,height:4,borderRadius:'50%',background:'#22C55E'}}/> {parts.length} participante{parts.length!==1?'s':''}<span style={{width:4,height:4,borderRadius:'50%',background:'#22C55E'}}/> palpites protegidos até a bola rolar</span>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:'auto',maxWidth:980,width:'100%',margin:'0 auto'}}>
        {tab==='home'&&TabHome}
        {tab==='matches'&&TabMatches}
        {tab==='general'&&TabGeneralPreds}
        {tab==='ranking'&&TabRanking}
        {tab==='rules'&&TabRules}
        {tab==='admin'&&TabAdmin}
      </div>

      {/* Bottom nav */}
      <div className="bottom-nav-premium" style={{position:'fixed',bottom:0,left:0,right:0,background:'rgba(255,255,255,.9)',backdropFilter:'blur(10px)',borderTop:`1px solid ${T.border}`,display:'flex',boxShadow:'0 -2px 12px rgba(0,0,0,.06)',zIndex:100}}>
        {[
          {k:'home',icon:'🏠',l:'Início'},
          {k:'matches',icon:'⚽',l:'Seus palpites'},
          {k:'general',icon:'📋',l:'Gerais'},
          {k:'ranking',icon:'🏆',l:'Ranking'},
          isAdmin ? {k:'admin',icon:'⚙️',l:'Admin'} : {k:'rules',icon:'📘',l:'Regras'},
        ].map(({k,icon,l})=>(
          <button key={k} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'10px 0 calc(10px + env(safe-area-inset-bottom))',background:'none',border:'none',cursor:'pointer',color:tab===k?T.accent:T.txt3,borderTop:`2px solid ${tab===k?T.accent:'transparent'}`}}
            onClick={()=>{
              if(k==='admin'&&!isAdmin){
                showToast('Sem permissão de admin para este usuário.',false);
              }else setTab(k);
            }}>
            <span style={{width:34,height:28,borderRadius:14,background:tab===k?T.accentLt:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:tab===k?20:18,boxShadow:tab===k?'0 6px 16px rgba(22,163,74,.16)':'none'}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:tab===k?700:500}}>{l}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Bolao/>);
</script>
</body>
</html>
